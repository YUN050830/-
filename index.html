
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 팀 나누기</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4ff;
            text-align: center;
            padding: 30px;
        }

        h1, h2 {
            color: #3157a4;
        }

        .team-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin: 30px auto;
        }

        .team {
            background: white;
            padding: 25px;
            width: 220px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .members {
            font-size: 21px;
            line-height: 1.8;
            font-weight: bold;
        }

        button {
            background: #3157a4;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #1e3d7a;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        input {
            padding: 12px;
            font-size: 18px;
            width: 180px;
            border: 1px solid #aaa;
            border-radius: 8px;
            text-align: center;
        }

        .money-area {
            margin: 30px auto;
        }

        .current-money {
            color: #e05b45;
            font-size: 22px;
            font-weight: bold;
        }

        .personal-container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .person {
            display: flex;
            justify-content: space-between;
            padding: 13px;
            border-bottom: 1px solid #eee;
            font-size: 18px;
        }

        .person:last-child {
            border-bottom: none;
        }

        .personal-money {
            font-weight: bold;
            color: #e05b45;
        }

        .reset-button {
            background: #d9534f;
        }

    </style>
</head>

<body>

    <!-- 앱 화면 -->
    <h1>🎲 랜덤 팀 나누기</h1>
    <p>팀을 나눈 후 승리 팀을 선택하세요!</p>

    <!-- 팀 화면 -->
    <div class="team-container">

        <div class="team">
            <h2>1팀</h2>
            <div class="members" id="team1">?</div>

            <button id="win1" onclick="addScore(1)" disabled>
                1팀 승리!
            </button>
        </div>

        <div class="team">
            <h2>2팀</h2>
            <div class="members" id="team2">?</div>

            <button id="win2" onclick="addScore(2)" disabled>
                2팀 승리!
            </button>
        </div>

    </div>

    <button id="startButton" onclick="makeTeams()">
        팀 나누기!
    </button>


    <!-- 금액 설정 -->
    <div class="money-area">

        <h2>💰 금액 설정</h2>

        <input
            type="number"
            id="moneyInput"
            placeholder="금액 입력"
            min="1"
            step="1"
        >

        <br>

        <button onclick="setMoney()">
            금액 적용
        </button>

        <p>현재 적용 금액</p>

        <div class="current-money" id="currentMoney">
            0원
        </div>

        <p>금액을 변경하기 전까지 계속 유지됩니다.</p>

    </div>


    <!-- 개인별 누적 금액 -->
    <div class="personal-container">

        <h2>👤 개인별 누적 금액</h2>

        <div class="person">
            <span>성빈</span>
            <span class="personal-money" id="성빈">0원</span>
        </div>

        <div class="person">
            <span>종민</span>
            <span class="personal-money" id="종민">0원</span>
        </div>

        <div class="person">
            <span>근우</span>
            <span class="personal-money" id="근우">0원</span>
        </div>

        <div class="person">
            <span>선우</span>
            <span class="personal-money" id="선우">0원</span>
        </div>

    </div>

    <button class="reset-button" onclick="resetScore()">
        전체 점수 초기화
    </button>


    <script>

        // ===== 랜덤 팀 나누기 =====

        // 참가자
        const names = ["성빈", "종민", "근우", "선우"];

        // 개인별 누적 금액
        let personalScores = {
            "성빈": 0,
            "종민": 0,
            "근우": 0,
            "선우": 0
        };

        // 현재 팀
        let team1 = [];
        let team2 = [];

        // 현재 적용 금액
        let currentMoney = 0;

        // 승리 팀 선택 여부
        let winnerSelected = true;

        // 팀 편성 중인지 확인
        let isDrawing = false;


        // 금액 설정
        function setMoney() {

            let money = Number(
                document.getElementById("moneyInput").value
            );

            if (!Number.isSafeInteger(money) || money <= 0) {
                alert("올바른 금액을 입력해주세요!");
                return;
            }

            currentMoney = money;

            document.getElementById("currentMoney").innerHTML =
                currentMoney.toLocaleString() + "원";

            document.getElementById("moneyInput").value = "";

            alert("금액이 적용되었습니다!");
        }


        // 랜덤 팀 나누기
        function makeTeams() {

            if (isDrawing) return;

            let button = document.getElementById("startButton");

            isDrawing = true;
            winnerSelected = true;

            // 승리 버튼 비활성화
            document.getElementById("win1").disabled = true;
            document.getElementById("win2").disabled = true;

            button.disabled = true;
            button.innerHTML = "팀 편성 중...";

            document.getElementById("team1").innerHTML = "편성 중...";
            document.getElementById("team2").innerHTML = "편성 중...";

            // 기존 팀 초기화
            team1 = [];
            team2 = [];

            setTimeout(function() {

                let shuffled = [...names];

                shuffled.sort(() => Math.random() - 0.5);

                team1 = shuffled.slice(0, 2);
                team2 = shuffled.slice(2, 4);

                document.getElementById("team1").innerHTML =
                    team1.join("<br>");

                document.getElementById("team2").innerHTML =
                    team2.join("<br>");

                // 새로운 팀 편성 완료
                winnerSelected = false;
                isDrawing = false;

                // 승리 버튼 활성화
                document.getElementById("win1").disabled = false;
                document.getElementById("win2").disabled = false;

                button.disabled = false;
                button.innerHTML = "다시 팀 나누기!";

            }, 2000);
        }


        // 승리 팀 점수 추가
        function addScore(team) {

            // 이미 승리 팀을 선택했는지 확인
            if (winnerSelected || isDrawing) {
                alert("이번 팀의 승리는 이미 결정되었습니다!");
                return;
            }

            // 금액 설정 여부 확인
            if (currentMoney <= 0) {
                alert("먼저 금액을 설정해주세요!");
                return;
            }

            let winners = (team === 1) ? team1 : team2;

            if (winners.length === 0) {
                alert("먼저 팀을 나눠주세요!");
                return;
            }

            // 중복 클릭 방지
            winnerSelected = true;

            // 두 버튼 모두 비활성화
            document.getElementById("win1").disabled = true;
            document.getElementById("win2").disabled = true;

            // 승리 팀원 각자에게 금액 추가
            winners.forEach(function(name) {

                personalScores[name] += currentMoney;

                document.getElementById(name).innerHTML =
                    personalScores[name].toLocaleString() + "원";

            });

            alert(team + "팀 승리! 각 팀원에게 " +
                currentMoney.toLocaleString() + "원이 추가되었습니다.");
        }


        // 전체 점수 초기화
        function resetScore() {

            if (confirm("모든 개인별 누적 금액을 초기화할까요?")) {

                names.forEach(function(name) {

                    personalScores[name] = 0;

                    document.getElementById(name).innerHTML = "0원";

                });

                // 현재 적용 금액은 유지
            }
        }


    </script>

</body>
</html>
